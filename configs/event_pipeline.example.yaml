# ReefShield event pipeline — annotated example configuration.
#
# Copy this file, change the values, and run:
#
#   python scripts/run_event_pipeline.py --config configs/my_event.yaml --dry-run
#
# Nothing about any particular event lives in the source code. Changing only
# this YAML runs the same pipeline for a different event, a different box and
# a different time range.
#
# All timestamps MUST be UTC and end with 'Z'. Local times are rejected.

event_id: EXAMPLE-EVENT-01          # becomes a directory name: no spaces or slashes
description: Annotated template showing every supported option.

spatial:                            # plain degrees; converted to each API's order
  # Terrain AOI per tasks/00-contracts.md §1. Rainfall must cover the FULL
  # contributing catchments — Wadi Yutum reaches ~90 km inland, to 35.89 E.
  # The old coastal box (34.80, 29.25, 35.15, 29.70) cut off ~85 % of it.
  west: 34.75
  south: 29.15
  east: 35.94
  north: 30.30

imerg:
  enabled: true
  run_type: final                   # 'final' (calibrated) or 'early' (preliminary)
  start_time: 2016-10-25T00:00:00Z
  end_time: 2016-10-28T05:59:59Z
  rolling_windows_hours: [1, 3, 6, 24]   # whole multiples of 0.5 h
  max_granules: 500                 # safety guard checked before submission
  chunk_granules: 48                # granules per Harmony job

era5_land:
  enabled: true
  start_time: 2016-10-26T00:00:00Z
  end_time: 2016-10-28T00:00:00Z
  variables:                        # canonical keys, CDS names or short names
    - soil_moisture
    - total_precipitation
    - surface_runoff
    - subsurface_runoff
    - u10
    - v10
    - temperature_2m
  temporal_semantics_mode: auto     # 'auto' proves from metadata, else raises
  chunk_mode: daily                 # avoids the CDS date x time product problem
  max_expected_timestamps: 2000
  negative_tolerance_m: 1.0e-7      # GRIB quantisation, not float64 noise

  antecedent:
    event_time: 2016-10-28T00:00:00Z
    soil_moisture_offsets_hours: [24, 72]
    precipitation_windows_hours: [24, 72, 168]
    runoff_windows_hours: [24, 72, 168]
    state_window_hours: 6

outputs:
  root_dir: data                    # must stay inside the project by default
  save_netcdf: true
  save_json: true
  save_parquet: true
  allow_external_paths: false

validation:
  minimum_data_completeness: 95.0   # percent of expected granules
  fail_on_missing_timestamps: true
  require_full_antecedent_windows: true
  minimum_valid_fraction: 1.0
