# ReefShield Aqaba — the whole stack, one command.
#
#   docker compose up --build              api + worker
#   docker compose --profile frontend up   adds the map, once Ali's shell exists
#
# There is no database service. The stack talks to Supabase Cloud, which is a
# deliberate decision and not an omission: it means the demo needs a live
# connection. The concept doc's risk register rates "downloads fail during
# demo" medium probability / high impact, and conference wifi is exactly that
# scenario. If it bites, the fix is a cached-fixture fallback in the api
# service rather than reinstating Postgres.

name: reefshield

x-supabase: &supabase
  # Set in .env, which is gitignored. .env.example lists every key.
  SUPABASE_URL: ${SUPABASE_URL:-}
  SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
  SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_KEY:-}
  SUPABASE_DSN: ${SUPABASE_DSN:-}

services:

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: api
    ports:
      # Host port is overridable: `API_PORT=8100 docker compose up`.
      # A hard-coded 8000 made `up` fail outright with "port is already allocated"
      # on a machine that had anything else on 8000 — and DoD item 6 is judged on a
      # laptop nobody controls. The container port stays 8000: the Dockerfile
      # HEALTHCHECK and CORS defaults both target it.
      - "${API_PORT:-8000}:8000"
    environment:
      <<: *supabase
      REEFSHIELD_ROOT: /app
      REEFSHIELD_CORS_ORIGINS: http://localhost:5173,http://localhost:3000
      GIT_SHA: ${GIT_SHA:-unknown}
      # Exposure runs are WRITTEN, and ./data is mounted read-only on purpose. Without
      # this the store fell over with "unable to open database file" and /alerts
      # returned a bare 500. Pointing it at a named volume keeps data/ read-only rather
      # than relaxing that rule to make a write succeed.
      REEFSHIELD_EXPOSURE_DB: /app/var/exposure_runs.sqlite
      # Phase 5's four new SQLite stores hit the exact same read-only-data/ wall the
      # first time they were tried against the running container — same fix, same
      # reasoning, applied four more times rather than relaxing the ./data:ro mount.
      REEFSHIELD_CANDIDATE_SITES_DB: /app/var/candidate_sites.sqlite
      REEFSHIELD_REPORTS_DB: /app/var/generated_reports.sqlite
      REEFSHIELD_SAMPLING_FEEDBACK_DB: /app/var/sampling_feedback.sqlite
      REEFSHIELD_REEF_PHOTOS_DB: /app/var/reef_zone_photos.sqlite
      # Uploaded photo bytes are also a write, for the same reason — never into
      # ./data, which is read-only on purpose.
      REEFSHIELD_REEF_PHOTOS_DIR: /app/var/reef_photos
    volumes:
      # Read-only: the API reads geometry and model artifacts, and must never
      # be the thing that writes to data/.
      - ./data:/app/data:ro
      # The API also reads prose: docs/event_dates.md is the single source of truth for
      # event timing, and the RAG corpus indexes data_dictionary.md, model_card.md and
      # forcing_limitations.md. Without this /events answered 503 "docs/event_dates.md
      # is not present" — the artifact was on the host all along, just not in the image.
      - ./docs:/app/docs:ro
      # Live reload in development. Drop this line for a production image.
      - ./backend/src:/app/backend/src:ro
      # /api/v1/dive-sites joins against Karam's places.geojson (the same file Ali's
      # map layer already reads) — mount only that one artifact, read-only, rather
      # than the whole frontend/ tree or a second copy of the data (see OPEN-ISSUES #22:
      # keep ONE copy of this GeoJSON).
      - ./frontend/public/basemap:/app/frontend/public/basemap:ro
      # The one writable path. Named, so it survives `down` but not `down -v`.
      - exposure_runs:/app/var
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: worker
    environment:
      <<: *supabase
      REEFSHIELD_ROOT: /app
      REEFSHIELD_WORKER_POLL: ${REEFSHIELD_WORKER_POLL:-30}
    volumes:
      # Writable, unlike the API: the worker is what runs the pipeline.
      - ./data:/app/data
      - ./backend/src:/app/backend/src:ro
      - ./scripts:/app/scripts:ro
    # No ports. The worker is never called - it picks work up.
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    # Behind a profile so `docker compose up` works for everyone before the
    # frontend exists. Ali's directory is not created here - that is his.
    profiles: ["frontend"]
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    environment:
      VITE_API_URL: http://localhost:${API_PORT:-8000}
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      api:
        condition: service_healthy

volumes:
  # Exposure runs. A named volume rather than a bind mount into ./data, because ./data
  # is read-only by design and the API must not be the thing that writes to it.
  # `docker compose down` keeps it; `down -v` discards it.
  exposure_runs:
